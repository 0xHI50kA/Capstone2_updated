<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Announcement</title>
    <style>
        * {
            margin: 0; padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
        }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            margin-top: 80px;
            width: 90%;
            max-width: 900px;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        .btn-primary, .btn-secondary {
            padding: 12px;
            font-size: 16px;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary { background-color: #007bff; }
        .btn-primary:hover { background-color: #0056b3; }

        .btn-secondary { background-color: #28a745; }
        .btn-secondary:hover { background-color: #1e7e34; }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .image-preview {
            text-align: center;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            display: none;
        }

        /* Modal Styles */
        #confirmModal, #previewModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            width: 400px;
            max-width: 90%;
        }

        .modal-buttons {
            margin-top: 15px;
        }

        .modal-buttons button {
            margin: 5px;
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        .confirm {
            background-color: green;
            color: white;
        }

        .cancel {
            background-color: gray;
            color: white;
        }

        #successMessage {
            display: none;
            color: green;
            font-weight: bold;
            margin-top: 15px;
        }

        #previewModal img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }

        #previewContent {
            text-align: left;
            margin-top: 10px;
        }

    </style>
</head>
<body>

<div class="page-wrapper">
    <h1>Add Announcement</h1>

    <div class="container">
        <form id="announcementForm">
            <label for="title">Announcement Title:</label>
            <input type="text" id="title" name="title" required placeholder="Enter announcement title">

            <label for="content">Announcement Content:</label>
            <textarea id="content" name="content" rows="7" required placeholder="Write announcement details here..."></textarea>

            <label for="image">Upload Image:</label>
            <input type="file" id="image" name="image" accept="image/*" onchange="previewImage(event)" required>

            <div class="image-preview">
                <img id="preview" alt="Image Preview">
            </div>

            <div class="button-group">
                <button type="button" class="btn-secondary" onclick="openPreviewModal()">Preview</button>
                <button type="button" class="btn-primary" onclick="openModal()">Submit</button>
            </div>
        </form>
    </div>
</div>

<!-- Confirmation Modal -->
<div id="confirmModal">
    <div class="modal-content">
        <h2 id="modalTitle">📢 Confirm Submission</h2>
        <p id="modalMessage">Are you sure you want to post this announcement?</p>

        <div class="modal-buttons" id="modalButtons">
            <button type="button" class="confirm" onclick="confirmSubmit()">Yes, Post</button>
            <button type="button" class="cancel" onclick="closeModal()">Cancel</button>
        </div>

        <div id="successMessage">✅ Announcement added successfully!</div>
    </div>
</div>

<!-- Preview Modal -->
<div id="previewModal">
    <div class="modal-content">
        <h2>📢 Announcement Preview</h2>
        <h3 id="previewTitle"></h3>
        <p id="previewContent"></p>
        <img id="previewImage" alt="Preview Image">

        <div class="modal-buttons">
            <button type="button" class="cancel" onclick="closePreviewModal()">Close</button>
        </div>
    </div>
</div>

<script>
    // Image Preview (for form)
    function previewImage(event) {
        const file = event.target.files[0];
        const preview = document.getElementById("preview");
        if (file) {
            const reader = new FileReader();
            reader.onload = function() {
                preview.src = reader.result;
                preview.style.display = "block";
            };
            reader.readAsDataURL(file);
        } else {
            preview.src = "";
            preview.style.display = "none";
        }
    }

    // Modal: Confirmation
    function openModal() {
        document.getElementById("confirmModal").style.display = "flex";
        document.getElementById("modalButtons").style.display = "block";
        document.getElementById("successMessage").style.display = "none";
        document.getElementById("modalMessage").style.display = "block";
        document.getElementById("modalTitle").innerText = "📢 Confirm Submission";
    }

    function closeModal() {
        document.getElementById("confirmModal").style.display = "none";
    }

    function confirmSubmit() {
        document.getElementById("modalButtons").style.display = "none";
        document.getElementById("modalMessage").style.display = "none";
        document.getElementById("modalTitle").innerText = "✅ Announcement Added!";
        document.getElementById("successMessage").style.display = "block";

        setTimeout(() => {
            closeModal();
            document.getElementById("announcementForm").reset();
            document.getElementById("preview").style.display = "none";
        }, 1500);
    }

    // Modal: Preview
    function openPreviewModal() {
        const title = document.getElementById("title").value;
        const content = document.getElementById("content").value;
        const image = document.getElementById("preview").src;

        if (!title || !content) {
            alert("Please fill out the title and content first.");
            return;
        }

        document.getElementById("previewTitle").innerText = title;
        document.getElementById("previewContent").innerText = content;

        const previewImage = document.getElementById("previewImage");
        if (image && image !== window.location.href) {
            previewImage.src = image;
            previewImage.style.display = "block";
        } else {
            previewImage.style.display = "none";
        }

        document.getElementById("previewModal").style.display = "flex";
    }

    function closePreviewModal() {
        document.getElementById("previewModal").style.display = "none";
    }
</script>

</body>
</html>
